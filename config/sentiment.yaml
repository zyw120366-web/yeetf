name: ye 题材情绪审核
status: frozen_for_live
frozen_on: '2026-07-22'
execution: 每个交易日收盘后采集并冻结；只允许用于下一交易日开盘信号
sources:
  strong_theme: 同花顺强势股题材归因
  limit_sentiment: 东财涨停/炸板/跌停池（可用时）
  news: 财联社电报与东财全球资讯（只保留当时抓取快照）
features:
  - 各ETF类别匹配的强势股数量
  - 类别强势股成交额合计与全市场占比
  - 类别大单净量为正的股票比例
  - 题材热度相对过去5个已冻结交易日的加速度
  - 全市场炸板率、跌停数和连板高度
rules:
  immutable_raw_snapshots: true
  cross_source_event_deduplication: 同一交易日同一公司逐行审核但题材强度只计一次
  category_broadcast_to_symbols: false
  direct_symbol_keyword_required: true
  missing_source_means_unknown_not_zero: true
  historical_backfill_for_2021_2022_forbidden: true
  historical_features_available_from: '2024-01-01'
  missing_history_fallback: 只使用当时可得的ETF价格、排名与类别广度，不把缺失情绪填成0
  live_use_allowed: true
  ai_review_required_for_every_collected_row: true
  incomplete_review_action: 禁止使用部分情绪数据；不开新仓，价格卖出规则仍正常执行
  after_close_use: AI审核完成的数据才可参与下一交易日开盘信号
  preopen_news_use: 只允许阻止新买入，不允许制造买入、延迟卖出或改变ETF排序
  adverse_preopen_block: AI负面风险不低于0.80且置信度不低于0.75
ai_review:
  reviewer: current Codex chat
  structured_output: true
  review_mode: each collected row is reviewed and written by Codex in the current conversation
  required_environment: none
  audit_fields: [source_hash, relevant, matched_categories, matched_symbols, direction, horizon, confidence, novelty, summary, evidence, risk_flags]
  protocol: config/sentiment_review_policy.yaml
  reproducibility_fields: [model_family, model_snapshot, surface, reviewed_in_current_conversation, protocol_sha256, sentiment_config_sha256, review_schema_sha256]
