  warmup_start: '2014-01-01'
  backtest_start: '2018-07-02'
  data_end: '2026-08-21'
  data_count: 3000
  lot_size: 100

data_policy:
  historical_bars: easy-tdx / 通达信前复权日线
  quote_verification: 腾讯行情接口（按 a-stock-data 的直连方法核验）
  universe_source: 冻结45只核心池 + 经覆盖、流动性和相关性审计的6只挑战者池

execution:
  routine:
    run_time: 前一交易日收盘后计算，下一交易日开盘执行
    signal_data: 前一交易日完整日线
    historical_fill_proxy: 下一交易日开盘价加规则中冻结的固定滑点
    note: 当前日线数据足以严格复现本执行口径，不再模拟任何盘中成交
  minimum_commission: 5.0
  detect_locked_limits: true
  locked_limit_threshold: 0.095
  max_participation_rate: 0.001
  liquidity_lookback_days: 20
  minimum_entry_amount: 20000000
  fixed_cost_frozen_on: '2026-07-17'
  fixed_default: {commission_rate: 0.0003, slippage_rate: 0.0012}
  fixed_premium_sensitive: {commission_rate: 0.0003, slippage_rate: 0.0027}
  fixed_cost_note: 普通ETF单边0.15%，QDII及溢价敏感ETF单边0.30%；另有每笔最低佣金5元。正式回测和候选验收只使用这一套成本，不再切换情景。

