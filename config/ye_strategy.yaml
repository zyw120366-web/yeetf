name: ye 策略
role: 唯一正式策略
status: frozen_for_live
frozen_on: '2026-07-29'

execution:
  signal_time: 每个交易日收盘后
  trade_time: 下一交易日开盘
  historical_fill_proxy: 下一交易日开盘价加固定滑点
  ordinary_etf_one_way_cost: 0.0015
  qdii_or_premium_sensitive_one_way_cost: 0.0030
  minimum_commission: 5
  cost_rule: 唯一固定成本；回测、压力检查和实盘记录都不得切换成本口径

cash_management:
  enabled: true
  product: 收盘宝
  instrument: 1天期通用质押式回购
  purpose: 仅管理ETF交易后闲置现金；不产生、不筛选、不覆盖任何ETF买卖信号
  subscribe_window: 交易日15:00-15:30
  maturity: 下一交易日开盘前本金和利息回到股票账户可用资金
  amount_rule: 收盘可用现金大于1000元时，按1000元整数倍申报；保留无法整除的余额
  minimum_order: 1000
  order_lot: 1000
  fee_rate: 0.00001
  minimum_fee: 0.0
  annualized_yield: 下单时实时值；不得在实盘计划中写死或承诺收益
  historical_backtest_annual_rate: 0.015
  historical_backtest_note: 过去几年平均年化的统一回测口径；按1000元整数倍和十万分之一费用模拟，不代表逐日实际成交收益
  interest_count: Actual/365，周末和节假日按实际占款天数计息
  safeguards:
    - 仅在券商已启用收盘宝、当日可下单且显示下一交易日开盘前可用时执行
    - 下单失败、收益率缺失、额度不足或到账异常时，保留现金；不得影响ETF卖出或买入计划
    - 每日运行卡必须记录是否启用、下单时年化、预计申报规则和任何异常
  risk_notice: 低风险不等于无风险；须持续满足券商适当性要求（截图显示C3及以上）

rules:
  roc_short_days: 20
  roc_medium_days: 60
  roc_short_weight: 1.0
  roc_medium_weight: 1.5
  entry_rank_limit: 5
  holdings_num: 1
  ma_days: 120
  max_entry_ma_bias: 0.09
  rank_change_short_days: 5
  rank_change_long_days: 20
  exit_confirmation_days: 1
  ma_exit_confirmation_days: 1
  roc_exit_confirmation_days: 1
  require_short_roc_positive: true
  require_medium_roc_positive: true
  require_above_ma: true
  exit_on_ma_break: true
  exit_on_short_roc_negative: true
  exit_on_dual_rank_decline: true
  macd_soft_exit_confirmation: false
  listing_warmup_days: 120
  liquidity_lookback_days: 20
  minimum_entry_amount: 20000000
  defensive_etf: null

enhanced_selection:
  fixed_pool_size: 51
  universe_architecture:
    mode: core_champion_cash_gap
    core_pool_size: 45
    challenger_symbols:
      - 560280.SH
      - 561380.SH
      - 512980.SH
      - 513520.SH
      - 513030.SH
      - 561360.SH
    entry_rule: 核心45只继续独立形成前5/前3强度标尺并拥有第一买入权；只有当天没有任何合格核心候选时，完整合格的挑战者才按相对核心池的虚拟排名竞争
    isolation_rule: 挑战者不得稀释核心类别宽度、不得占据核心排名名额、不得改变核心持仓的排名退出；持有挑战者时一旦出现合格核心候选，下一开盘让位；挑战者只能影响核心原本没有候选的空档
    live_selection_order: 先检查旧仓卖出；核心旧仓未卖出时再检查正式机会换仓，未满足则继续持有；空仓时核心候选优先；无核心候选才选挑战者；挑战者持仓遇核心候选时先卖挑战者再买核心
    promotion_rule: 挑战者只在半年或年度池版本复核中考虑晋升；每日执行不得调整核心池或挑战者清单
  price_only_for_historical_dates_without_sentiment:
    entry_rank_limit: 3
    category_roc20_positive_breadth_min: 0.75
    soft_exit_protection:
      rank_limit: 3
      roc60_min: 0.08
      require_above_ma120: true
    note: 仅用于历史缺失期复现；挑战者宽度只取核心池同类，核心无同类时不得自我确认；实盘情绪审核不完整时不开新仓
  sentiment_available:
    source: a-stock-data盘面数据 + 财联社快讯，经AI逐条结构化审核
    ai_review_required: true
    ai_review_mode: current Codex chat reviews every collected row; no external API key
    evidence_normalization: 每行保留审核；ETF映射必须有专属关键词直接支持；同日同公司跨来源在特征层只计一次
    incomplete_review_action: 不开新仓；既有仓位的价格卖出规则继续执行
    weak_edge_filter:
      applies_when: 基础排名4至5且ROC20低于2%
      confirmation: 匹配题材强势股至少3只、数量加速不低于0、正DDE占比至少50%
    emerging_trend:
      memory_days: 3
      maximum_base_rank: 15
      roc20_min: 0.03
      roc60_range: [-0.08, 0.0]
      ma120_bias_range: [-0.03, 0.09]
      r2_20_min: 0.70
      efficiency20_min: 0.20
      matched_hot_stocks_min: 3
      hot_score_min: 0.45
      count_acceleration_min: 0.25
      positive_dde_share_min: 0.50
      ranking_score: ROC20 + 0.05 × R²20
    quality_extension:
      ma120_bias_range: [0.09, 0.12]
      base_rank_limit: 5
      r2_20_min: 0.75
      efficiency20_min: 0.40
      roc5_min: -0.01
      matched_hot_stocks_min: 2
      hot_score_min: 0.45
      count_acceleration_min: 0.0
    hot_exit_protection:
      hot_score_min: 0.60
      matched_hot_stocks_min: 3
      positive_dde_share_min: 0.50
      memory_days: 2
      protects: ROC20转负与排名衰退两类软退出
      never_protects: MA120破位
  reentry_cooldown_days: 5
  opportunity_switch:
    enabled: true
    applies_to: 仅允许核心ETF换到另一只核心ETF；卫星继续遵守核心恢复即让位
    held_rank_must_exceed: 5
    candidate_requirement: 另一只核心ETF必须完整通过当天正式买入条件
    minimum_score_advantage: 0.05
    score_definition: ROC20 + 1.5 × ROC60；比较原始动量分，不使用新趋势专属选择分
    confirmation_days: 2
    same_candidate_required: true
    minimum_hold_days: 5
    live_baseline_on: '2026-07-29'
    live_confirmation_starts_on: '2026-07-30'
    execution: 第2个连续确认日收盘形成信号，下一交易日开盘全仓先卖旧仓、再买新仓
    reset_rule: 任一条件中断或领先ETF改变，连续计数归零

plain_language:
  score: ROC20 × 1.0 + ROC60 × 1.5；45只核心池形成冻结强度标尺，6只挑战者用相同分数与核心标尺比较
  buy: 核心池照旧要求前5、双ROC为正、位于MA120上方且乖离不超过9%，并拥有第一买入权；只有当天无合格核心候选时，挑战者才可在完整通过上市、流动性、价格与AI路径后填补空档；核心候选恢复时挑战者让位
  hold: 最多持有1只；旧仓未触发卖出且未满足机会换仓时继续持有；没有合格标的时持有现金
  sell: 跌破MA120、ROC20转负、或当前排名同时差于5日前和20日前，任一触发即退出；只有已审核热点可短暂保护软退出，MA120破位不延迟
  switch: 核心旧仓掉出前5、另一只完整合格核心ETF的动量分领先至少5个百分点、同一候选连续2日成立，且旧仓已持有满5个交易日时，下一开盘全仓换入；任一条件中断即重新计数
  news: 所有已采集盘面与新闻逐条由AI审核；漏审、重复或来源失败均视为情绪数据不可用，禁止部分数据进入买入信号

