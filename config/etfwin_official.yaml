public_information:
  score: 总分 = ROC20 × 1.0 + ROC60 × 1.5
  buy: 排名前5、ROC20与ROC60均为正；指南同时强调MA120下方不参与，MA120乖离超过15%不追高。
  sell: MA120破位、ROC20转负、5日与20日排名同时下滑均为风险信号。
  limitation: 指南是操作纪律，不是完整自动交易源码；“市场好时扩展前10”没有公开量化定义，本地固定使用前5、最多持有1只。按用户要求，本地执行不买指南中的511880防御标的，无合格ETF时保留现金。
  maintenance: 每次正式运行用与ye相同的数据截止日、次日开盘执行和成本模型重建历史参考；不生成当前持仓，也不参与ye策略选池或调参。
